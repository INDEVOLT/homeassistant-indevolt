set_solidflex_powerflex_work_mode:
  name: Set SolidFlex2000/PowerFlex2000 Work Mode
  description: Configure operating mode and control parameters for SolidFlex2000 / PowerFlex2000 devices.
  
  target:
    device:
      integration: indevolt

  fields:

    mode:
      name: Work Mode
      description: Select device work mode
      required: true
      selector:
        select:
          options:
            - Self-Consumed Prioritized
            - Real-Time Control
            - Charge/Discharge Schedule

    state:
      name: Status
      description: Available in Real-time control
      required: false
      selector:
        select:
          options:
            - Standby
            - Charging
            - Discharging

    # 原因：若 selector 仍保持 2400，HA 界面会在 Python 写前保护之前阻止合法的更高输入。
    # 目标：让 SolidFlex/PowerFlex Action 的可见上限与共享 10800 W 运行时边界一致。
    # 实现：只把该 power 字段的说明和 selector.max 从 2400 改为 10800。
    # 影响：Action UI 可选择更高功率，step 仍为 10 W；Python 继续承担绕过 UI 的保护。
    # 边界：min=50、BK selector、SOC 字段、设备协议和其他服务字段不变。
    # 验证：YAML 一致性测试核对完整 selector，并同时断言 BK selector 保持 0～1200 W。
    power:
      name: Power (W)
      description: 50~10800W (Available in Real-time control)
      required: false
      selector:
        number:
          min: 50
          max: 10800
          step: 10
          unit_of_measurement: W

    soc:
      name: Target SOC (%)
      description: 5~100% (Available in Real-time control)
      required: false
      selector:
        number:
          min: 5
          max: 100
          step: 1
          unit_of_measurement: "%"

set_bk1600_work_mode:
  name: Set BK1600/BK1600 Ultra Work Mode
  description: Configure BK1600 / BK1600 Ultra device operating mode.

  target:
    device:
      integration: indevolt

  fields:

    mode:
      name: Work Mode
      description: Set Real-Time Control Mode
      required: true
      selector:
        select:
          options:
            - Real-Time Control

    state:
      name: Status
      description: Available in Real-time control
      required: false
      selector:
        select:
          options:
            - Standby
            - Charging
            - Discharging

    power:
      name: Power (W)
      description: Charging:0-1200W; Discharging:0-800W (Available in Real-time control)
      required: false
      selector:
        number:
          min: 0
          max: 1200
          step: 10
          unit_of_measurement: W

    soc:
      name: Target SOC (%)
      description: 5~100% (Available in Real-time control)
      required: false
      selector:
        number:
          min: 0
          max: 100
          step: 1
          unit_of_measurement: "%"
