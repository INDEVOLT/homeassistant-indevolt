[pytest]
# 覆盖目标：审核命令执行后不应产生与交付无关的 .pytest_cache。
# 实现方式：通过 addopts 禁用 cacheprovider 插件。
# 能够证明：重复执行聚焦测试不会新增 pytest 缓存文件。
# 不能证明：该选项不验证测试断言本身，也不清理其他工具生成的缓存。
addopts = -p no:cacheprovider
# 覆盖目标：pytest 以 tests 为根时仍能稳定发现当前聚焦测试。
# 实现方式：把本配置的 testpaths 明确限定为当前目录。
# 能够证明：显式测试命令和 tests 根目录收集指向同一套测试文件。
# 不能证明：该配置不接管仓库外、HA Core 或其他集成的测试发现。
testpaths = .
