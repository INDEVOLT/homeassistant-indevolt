[pytest]
# Coverage goal: The review command must not create an unrelated .pytest_cache.
# Implementation: Disable the cacheprovider plugin through addopts.
# Proves: Repeated focused test runs do not add pytest cache files.
# Does not prove: This option does not validate test assertions or remove caches
# created by other tools.
addopts = -p no:cacheprovider
# Coverage goal: Pytest must discover the focused tests consistently when tests is
# the root directory.
# Implementation: Restrict this configuration's testpaths to the current directory.
# Proves: Explicit test commands and collection from the tests root target the same
# test files.
# Does not prove: This configuration does not control test discovery outside this
# repository, in HA Core, or for other integrations.
testpaths = .
